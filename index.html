<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ihatove Scoring App</title>
  
  <!-- ▼ PWA & ホーム画面用の設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IHATOVE">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #fff5f5; display: flex; justify-content: center; padding: 12px; }
    .app-container { background-color: #ffffff; width: 100%; max-width: 420px; padding: 16px; border-radius: 16px; box-shadow: 0 4px 16px rgba(255,107,107,0.15); border: 2px solid #ffe3e3; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 12px; color: #ff6b6b; font-weight: 900; letter-spacing: 1px; text-shadow: 1px 1px 0px #ffe3e3; }

    /* DAY切替タブ */
    .day-tabs { display: flex; gap: 8px; margin-bottom: 14px; background: #fff0f0; padding: 4px; border-radius: 12px; }
    .btn-day { flex: 1; padding: 10px 0; border: none; background: none; font-size: 0.95rem; font-weight: 900; color: #a0aec0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .btn-day.active { background-color: #ff6b6b; color: white; box-shadow: 0 2px 6px rgba(255,107,107,0.4); }
    
    .card-box { background: #fafafa; border: 1px solid #edf2f7; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 900; margin-bottom: 6px; color: #4a5568; }
    input[type="text"] { width: 100%; padding: 10px; font-size: 0.95rem; border: 2px solid #e2e8f0; border-radius: 8px; background-color: #fff; }

    /* アクションボタン群 */
    .action-buttons { display: flex; gap: 4px; }
    .btn-action-add { background: #e6fffa; border: 1px solid #319795; color: #319795; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; cursor: pointer; }
    .btn-action-manage { background: #edf2f7; border: 1px solid #718096; color: #718096; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; cursor: pointer; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

    .scroll-buttons {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .btn-select-chip {
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 900;
      color: #4a5568;
      flex-shrink: 0;
      transition: all 0.1s;
    }
    .btn-select-chip.active {
      background-color: #ff6b6b;
      color: white;
      border-color: #ff6b6b;
      box-shadow: 0 2px 4px rgba(255,107,107,0.3);
    }

    .info-fixed-box {
      background-color: #ebf8ff;
      border: 2px solid #bee3f8;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info-text { font-size: 0.85rem; color: #3182ce; font-weight: 900; }
    .btn-change { background: #ffffff; border: 2px solid #3182ce; color: #3182ce; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 900; }

    .score-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
    .btn-score { padding: 14px 0; font-size: 1.25rem; font-weight: 900; background-color: #ffffff; color: #2d3748; border: 2px solid #cbd5e0; border-radius: 10px; cursor: pointer; transition: all 0.1s; }
    .btn-score.active { background-color: #ff6b6b; color: white; border-color: #ff6b6b; box-shadow: 0 3px 6px rgba(255,107,107,0.4); transform: scale(1.05); }
    
    .submit-container { margin-top: 16px; }
    .btn-submit { width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 900; color: white; background-color: #48bb78; border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(72,187,120,0.3); cursor: pointer; }
    .btn-submit:active { transform: scale(0.98); }

    .summary-container { margin-top: 16px; padding-top: 12px; border-top: 2px dashed #e2e8f0; }
    .summary-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .summary-title { font-weight: 900; font-size: 0.9rem; color: #2d3748; }
    
    /* スタンディング用タブ */
    .summary-tabs { display: flex; gap: 4px; background: #edf2f7; padding: 3px; border-radius: 8px; }
    .btn-sum-tab { padding: 4px 10px; border: none; background: none; font-size: 0.75rem; font-weight: 900; color: #718096; border-radius: 6px; cursor: pointer; }
    .btn-sum-tab.active { background-color: #4a5568; color: white; }

    .summary-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
    .summary-table th { background-color: #edf2f7; color: #4a5568; padding: 6px 4px; text-align: left; font-size: 0.75rem; font-weight: 900; }
    .summary-table td { padding: 6px 4px; border-top: 1px solid #edf2f7; color: #2d3748; font-weight: 700; }
    .summary-score-total { font-weight: 900; color: #ff6b6b; font-size: 0.9rem; }

    .history-container { margin-top: 16px; padding-top: 12px; border-top: 2px dashed #e2e8f0; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .history-title { font-weight: 900; font-size: 0.9rem; color: #2d3748; }
    .history-actions { display: flex; gap: 4px; }
    .btn-sync { background-color: #3182ce; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; cursor: pointer; }
    .btn-export { background-color: #38a169; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; cursor: pointer; }
    
    .history-list { list-style: none; max-height: 150px; overflow-y: auto; }
    .history-item { background: #fff; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.8rem; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .history-detail { display: flex; flex-direction: column; }
    .evaluator-tag { font-size: 0.7rem; color: #a0aec0; font-weight: 700; }
    .sync-badge { font-size: 0.65rem; padding: 1px 4px; border-radius: 4px; font-weight: 900; margin-left: 4px; }
    .sync-badge.synced { background-color: #c6f6d5; color: #22543d; }
    .sync-badge.unsynced { background-color: #feebc8; color: #744210; }
    .btn-delete { background: none; border: none; color: #e53e3e; font-size: 1.1rem; cursor: pointer; padding: 0 4px; }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🏁 IHATOVE SCORING</h1>

    <div class="day-tabs">
      <button class="btn-day" id="btn-day1" onclick="switchDay('DAY1')">✨ DAY 1</button>
      <button class="btn-day" id="btn-day2" onclick="switchDay('DAY2')">🚀 DAY 2</button>
    </div>

    <!-- クラス選択（固定表示＆変更可能） -->
    <div class="info-fixed-box" id="class-fixed-container" style="display: none;">
      <div class="info-text" id="class-display">🏆 クラス: 未選択</div>
      <button class="btn-change" onclick="changeClass()">変更</button>
    </div>

    <div class="card-box" id="class-selection-group">
      <div class="section-header">
        <label>🏆 クラス選択</label>
        <div class="action-buttons">
          <button class="btn-action-add" onclick="registerNewClass()">＋ 追加</button>
          <button class="btn-action-manage" onclick="manageClasses()">⚙️ 管理</button>
        </div>
      </div>
      <div class="scroll-buttons" id="class-button-list"></div>
      <input type="text" id="class-manual" placeholder="クラスを手入力" style="display: none; margin-top: 6px;">
    </div>

    <!-- 採点者表示 -->
    <div class="info-fixed-box">
      <div class="info-text" id="evaluator-display">👤 採点者: 未設定</div>
      <button class="btn-change" onclick="setEvaluator()">変更</button>
    </div>

    <div class="card-box">
      <div class="section-header">
        <label>🏍️ 対象Rider</label>
        <div class="action-buttons">
          <button class="btn-action-add" onclick="registerNewRider()">＋ 追加</button>
          <button class="btn-action-manage" onclick="manageRiders()">⚙️ 管理</button>
        </div>
      </div>
      <div class="scroll-buttons" id="quick-rider-list"></div>
      <input type="text" id="rider-manual" placeholder="ライダーを手入力" style="display: none; margin-top: 6px;">
    </div>

    <div class="card-box">
      <label>📍 セクション選択</label>
      <div class="scroll-buttons" id="section-button-list"></div>
    </div>

    <div class="card-box">
      <label>📊 減点数選択</label>
      <div class="score-buttons">
        <button type="button" class="btn-score" onclick="selectScore(0, this)">0</button>
        <button type="button" class="btn-score" onclick="selectScore(1, this)">1</button>
        <button type="button" class="btn-score" onclick="selectScore(2, this)">2</button>
        <button type="button" class="btn-score" onclick="selectScore(3, this)">3</button>
        <button type="button" class="btn-score" onclick="selectScore(5, this)">5</button>
      </div>
    </div>

    <div class="submit-container">
      <button type="button" class="btn-submit" onclick="saveScore()">✨ 採点を保存する</button>
    </div>

    <!-- 総合スタンディング（タブ切替仕様） -->
    <div class="summary-container">
      <div class="summary-header-row">
        <span class="summary-title">📈 スタンディング</span>
        <div class="summary-tabs">
          <button class="btn-sum-tab" id="btn-sum-day1" onclick="switchSummaryTab('DAY1')">DAY1</button>
          <button class="btn-sum-tab" id="btn-sum-day2" onclick="switchSummaryTab('DAY2')">DAY2</button>
          <button class="btn-sum-tab" id="btn-sum-total" onclick="switchSummaryTab('TOTAL')">総合</button>
        </div>
      </div>
      <div id="summary-content"></div>
    </div>

    <div class="history-container">
      <div class="history-header">
        <span class="history-title">📱 保存された記録</span>
        <div class="history-actions">
          <button class="btn-sync" onclick="syncToHQ()">☁️ 送信</button>
          <button class="btn-export" onclick="exportToCSV()">📥 CSV</button>
        </div>
      </div>
      <ul class="history-list" id="history-list"></ul>
    </div>
  </div>

  <script>
    const HQ_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbynZxtBLYcyis05tWjy4f4fuiVsR7dcf2wlbcCXZAmP8JGdsuFt9tbO9-vMgl4pAu7o6g/exec";

    let currentDay = localStorage.getItem('selected_day') || 'DAY1';
    let currentSummaryTab = localStorage.getItem('summary_tab') || 'TOTAL';
    let selectedScore = null;
    let currentEvaluator = localStorage.getItem('fixed_evaluator') || '';
    let selectedClassName = localStorage.getItem('fixed_class') || '';
    let selectedRiderName = '';
    let selectedSectionNum = 1;

    const defaultClasses = ['クラシック', 'ヒームカ', 'ネリ', 'ブドリ', 'トレールトライアル', 'ランド'];
    const defaultRiders = ['107 なりたりょう', '108 よねくらさん', '109 ごとうさん', '110 かすみくん'];

    function initDayUI() {
      document.getElementById('btn-day1').classList.toggle('active', currentDay === 'DAY1');
      document.getElementById('btn-day2').classList.toggle('active', currentDay === 'DAY2');
    }

    function switchDay(day) {
      currentDay = day;
      localStorage.setItem('selected_day', day);
      initDayUI();
      if (selectedRiderName && selectedRiderName !== '__MANUAL__') {
        syncSectionForRider(selectedRiderName);
      }
      renderHistory();
    }

    function switchSummaryTab(tab) {
      currentSummaryTab = tab;
      localStorage.setItem('summary_tab', tab);
      renderSummary();
    }

    function getClasses() {
      const saved = localStorage.getItem('registered_classes');
      if (!saved) {
        localStorage.setItem('registered_classes', JSON.stringify(defaultClasses));
        return defaultClasses;
      }
      try { return JSON.parse(saved); } catch (e) { return defaultClasses; }
    }

    function getGroupMembers() {
      const saved = localStorage.getItem('registered_riders');
      if (!saved) {
        localStorage.setItem('registered_riders', JSON.stringify(defaultRiders));
        return defaultRiders;
      }
      try { return JSON.parse(saved); } catch (e) { return defaultRiders; }
    }

    function initEvaluator() {
      if (!currentEvaluator) {
        setEvaluator();
      } else {
        updateEvaluatorDisplay();
      }
    }

    function setEvaluator() {
      let input = prompt('【必須】あなたの「ゼッケンナンバーとお名前」を入力してください:\n(例: 101 田中太郎)', currentEvaluator);
      while (!input || input.trim() === '') {
        alert('採点者の設定は必須です。入力してください。');
        input = prompt('【必須】あなたの「ゼッケンナンバーとお名前」を入力してください:\n(例: 101 田中太郎)');
      }
      currentEvaluator = input.trim();
      localStorage.setItem('fixed_evaluator', currentEvaluator);
      updateEvaluatorDisplay();
    }

    function updateEvaluatorDisplay() {
      document.getElementById('evaluator-display').textContent = `👤 採点者: ${currentEvaluator}`;
    }

    function initClassUI() {
      if (selectedClassName) {
        document.getElementById('class-selection-group').style.display = 'none';
        document.getElementById('class-fixed-container').style.display = 'flex';
        document.getElementById('class-display').textContent = `🏆 クラス: ${selectedClassName}`;
      } else {
        document.getElementById('class-selection-group').style.display = 'block';
        document.getElementById('class-fixed-container').style.display = 'none';
        renderClassList();
      }
    }

    function changeClass() {
      document.getElementById('class-fixed-container').style.display = 'none';
      document.getElementById('class-selection-group').style.display = 'block';
      renderClassList();
    }

    function renderClassList() {
      const classes = getClasses();
      const container = document.getElementById('class-button-list');
      let html = classes.map(c => `
        <button class="btn-select-chip ${c === selectedClassName ? 'active' : ''}" onclick="selectClass('${c}')">${c}</button>
      `).join('');
      html += `<button class="btn-select-chip ${selectedClassName === '__MANUAL__' ? 'active' : ''}" onclick="selectClass('__MANUAL__')">＋ 手入力</button>`;
      container.innerHTML = html;
    }

    function selectClass(c) {
      const manualInput = document.getElementById('class-manual');
      if (c === '__MANUAL__') {
        selectedClassName = '__MANUAL__';
        manualInput.style.display = 'block';
        manualInput.value = '';
        renderClassList();
      } else {
        selectedClassName = c;
        localStorage.setItem('fixed_class', selectedClassName);
        initClassUI();
      }
    }

    function registerNewClass() {
      const input = prompt('追加するクラス名を入力してください:');
      if (input && input.trim()) {
        let classes = getClasses();
        const newClass = input.trim();
        if (!classes.includes(newClass)) {
          classes.push(newClass);
          localStorage.setItem('registered_classes', JSON.stringify(classes));
          selectClass(newClass);
        } else {
          alert('そのクラスは既に登録されています。');
        }
      }
    }

    function manageClasses() {
      let classes = getClasses();
      let message = '削除したいクラスの番号を入力してください:\n\n';
      classes.forEach((c, idx) => message += `${idx + 1}: ${c}\n`);
      const input = prompt(message);
      if (input !== null && input.trim() !== '') {
        const num = parseInt(input.trim(), 10);
        if (!isNaN(num) && num >= 1 && num <= classes.length) {
          const removed = classes.splice(num - 1, 1);
          localStorage.setItem('registered_classes', JSON.stringify(classes));
          if (selectedClassName === removed[0]) {
            selectedClassName = '';
            localStorage.removeItem('fixed_class');
          }
          initClassUI();
          alert(`${removed[0]} クラスを削除しました。`);
        }
      }
    }

    function renderSectionUI() {
      const container = document.getElementById('section-button-list');
      let html = '';
      for (let i = 1; i <= 20; i++) {
        html += `<button class="btn-select-chip ${i === selectedSectionNum ? 'active' : ''}" onclick="selectSection(${i})">${i} SEC</button>`;
      }
      container.innerHTML = html;
    }

    function selectSection(num) {
      selectedSectionNum = num;
      renderSectionUI();
    }

    function getRiderNextSection(riderName, day) {
      if (!riderName) return 1;
      const key = `${day}_${riderName}`;
      const riderSections = JSON.parse(localStorage.getItem('rider_next_sections_v2') || '{}');
      return riderSections[key] || 1;
    }

    function updateRiderNextSection(riderName, day, currentSec) {
      if (!riderName) return;
      const key = `${day}_${riderName}`;
      const riderSections = JSON.parse(localStorage.getItem('rider_next_sections_v2') || '{}');
      let nextSec = currentSec + 1;
      if (nextSec > 20) nextSec = 1;
      riderSections[key] = nextSec;
      localStorage.setItem('rider_next_sections_v2', JSON.stringify(riderSections));
    }

    function syncSectionForRider(riderName) {
      selectedSectionNum = getRiderNextSection(riderName, currentDay);
      renderSectionUI();
    }

    function renderRiderUI() {
      const registered = getGroupMembers();
      const container = document.getElementById('quick-rider-list');
      let html = registered.map(r => `
        <button class="btn-select-chip ${r === selectedRiderName ? 'active' : ''}" onclick="pickRider('${r}')">${r}</button>
      `).join('');
      html += `<button class="btn-select-chip ${selectedRiderName === '__MANUAL__' ? 'active' : ''}" onclick="pickRider('__MANUAL__')">＋ 手入力</button>`;
      container.innerHTML = html;
    }

    function pickRider(name) {
      const manualInput = document.getElementById('rider-manual');
      if (name === '__MANUAL__') {
        selectedRiderName = '__MANUAL__';
        manualInput.style.display = 'block';
        manualInput.value = '';
      } else {
        selectedRiderName = name;
        manualInput.style.display = 'none';
        syncSectionForRider(name);
      }
      renderRiderUI();
    }

    function registerNewRider() {
      const input = prompt('追加するライダーの「ゼッケン＋お名前」を入力してください:\n(例: 111 さとうさん)');
      if (input && input.trim()) {
        let registered = getGroupMembers();
        const newName = input.trim();
        if (!registered.includes(newName)) {
          registered.push(newName);
          localStorage.setItem('registered_riders', JSON.stringify(registered));
          pickRider(newName);
        } else {
          alert('そのライダーは既に登録されています。');
        }
      }
    }

    function manageRiders() {
      let registered = getGroupMembers();
      let message = '削除したいライダーの番号を入力してください:\n\n';
      registered.forEach((m, idx) => message += `${idx + 1}: ${m}\n`);
      const input = prompt(message);
      if (input !== null && input.trim() !== '') {
        const num = parseInt(input.trim(), 10);
        if (!isNaN(num) && num >= 1 && num <= registered.length) {
          const removed = registered.splice(num - 1, 1);
          localStorage.setItem('registered_riders', JSON.stringify(registered));
          if (selectedRiderName === removed[0]) selectedRiderName = '';
          renderRiderUI();
          alert(`${removed[0]} を削除しました。`);
        }
      }
    }

    function selectScore(score, btn) {
      clearSelection();
      selectedScore = score;
      btn.classList.add('active');
    }

    function clearSelection() {
      document.querySelectorAll('.btn-score').forEach(b => b.classList.remove('active'));
    }

    function saveScore() {
      let finalClass = selectedClassName === '__MANUAL__' ? document.getElementById('class-manual').value.trim() : selectedClassName;
      let finalRider = selectedRiderName === '__MANUAL__' ? document.getElementById('rider-manual').value.trim() : selectedRiderName;
      const sectionLabel = `${selectedSectionNum} SEC`;

      if (!finalClass) { alert('クラスを選択してください！'); return; }
      if (!currentEvaluator) { alert('採点者が設定されていません。'); setEvaluator(); return; }
      if (!finalRider) { alert('対象ライダーを選択してください！'); return; }
      if (selectedScore === null) { alert('減点数を選択してください！'); return; }

      if (selectedClassName === '__MANUAL__') {
        selectedClassName = finalClass;
        localStorage.setItem('fixed_class', selectedClassName);
        initClassUI();
      }

      let history = JSON.parse(localStorage.getItem('trial_scores_v2') || '[]');
      const isDuplicate = history.some(item => item.day === currentDay && item.rider === finalRider && item.section === sectionLabel);
      
      if (isDuplicate) {
        const overwrite = confirm(`⚠️ 【警告】\n「${finalRider}」の「${sectionLabel} (${currentDay})」は、すでにこの端末に記録されています。\n\n重複して登録しますか？`);
        if (!overwrite) return;
      }

      let registered = getGroupMembers();
      if (!registered.includes(finalRider) && finalRider !== '__MANUAL__') {
        registered.push(finalRider);
        localStorage.setItem('registered_riders', JSON.stringify(registered));
      }

      const record = {
        id: Date.now(),
        day: currentDay,
        evaluator: currentEvaluator,
        class: finalClass,
        rider: finalRider,
        section: sectionLabel,
        score: selectedScore,
        time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        synced: false
      };

      history.unshift(record);
      localStorage.setItem('trial_scores_v2', JSON.stringify(history));

      alert(`保存しました！ [${currentDay}]\nクラス: ${finalClass}\nRider: ${finalRider}\n${sectionLabel} / 減点:${selectedScore}点`);

      clearSelection();
      selectedScore = null;
      
      updateRiderNextSection(finalRider, currentDay, selectedSectionNum);
      syncSectionForRider(finalRider);

      renderRiderUI();
      renderSummary();
      renderHistory();
    }

    function deleteRecord(id) {
      if (confirm('この記録を削除しますか？')) {
        let history = JSON.parse(localStorage.getItem('trial_scores_v2') || '[]');
        history = history.filter(item => item.id !== id);
        localStorage.setItem('trial_scores_v2', JSON.stringify(history));
        renderSummary();
        renderHistory();
      }
    }

    async function syncToHQ() {
      let history = JSON.parse(localStorage.getItem('trial_scores_v2') || '[]');
      const unsynced = history.filter(item => !item.synced);

      if (unsynced.length === 0) {
        alert('送信待ちの新しい記録はありません。');
        return;
      }

      if (!navigator.onLine) {
        alert('現在オフライン状態です。電波の良い場所で再度ボタンを押してください。');
        return;
      }

      try {
        alert(`${unsynced.length}件の記録を本部に送信しています...`);
        
        await fetch(HQ_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(unsynced)
        });

        history = history.map(item => {
          item.synced = true;
          return item;
        });
        localStorage.setItem('trial_scores_v2', JSON.stringify(history));

        renderHistory();
        alert('本部への送信が完了しました！');
      } catch (error) {
        alert('送信に失敗しました。エラー: ' + error.message);
      }
    }

    function exportToCSV() {
      const history = JSON.parse(localStorage.getItem('trial_scores_v2') || '[]');
      if (history.length === 0) { alert('出力するデータがありません。'); return; }

      let csvContent = "\uFEFFDAY,日時,クラス,セクション,対象ライダー,減点数,採点者\n";
      history.forEach(item => {
        csvContent += `"${item.day}","${item.time}","${item.class || '未設定'}","${item.section}","${item.rider}","${item.score}","${item.evaluator}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `ihatov_scores_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function renderSummary() {
      document.getElementById('btn-sum-day1').classList.toggle('active', currentSummaryTab === 'DAY1');
      document.getElementById('btn-sum-day2').classList.toggle('active', currentSummaryTab === 'DAY2');
      document.getElementById('btn-sum-total').classList.toggle('active', currentSummaryTab === 'TOTAL');

      const container = document.getElementById('summary-content');
      const history = JSON.parse(localStorage.getItem('trial_scores_v2') || '[]');

      if (history.length === 0) {
        container.innerHTML = '<p style="color:#a0aec0; font-size:0.75rem; padding:6px 0;">記録が保存されるとここに順位が表示されます</p>';
        return;
      }

      const summaryMap = {};
      history.forEach(item => {
        const key = item.rider;
        if (!summaryMap[key]) {
          summaryMap[key] = {
            rider: item.rider,
            class: item.class || '未設定',
            day1: 0,
            day2: 0
          };
        }
        if (item.day === 'DAY1') summaryMap[key].day1 += Number(item.score);
        if (item.day === 'DAY2') summaryMap[key].day2 += Number(item.score);
      });

      let summaryList = Object.values(summaryMap).map(s => ({
        ...s,
        total: s.day1 + s.day2
      }));

      if (currentSummaryTab === 'DAY1') {
        summaryList.sort((a, b) => a.day1 - b.day1);
      } else if (currentSummaryTab === 'DAY2') {
        summaryList.sort((a, b) => a.day2 - b.day2);
      } else {
        summaryList.sort((a, b) => a.total - b.total);
      }

      let tableHtml = `
        <table class="summary-table">
          <thead>
            <tr>
              <th>ライダー</th>
              <th>クラス</th>
              ${currentSummaryTab === 'DAY1' ? '<th>DAY1</th>' : ''}
              ${currentSummaryTab === 'DAY2' ? '<th>DAY2</th>' : ''}
              ${currentSummaryTab === 'TOTAL' ? '<th>DAY1</th><th>DAY2</th><th>合計</th>' : ''}
            </tr>
          </thead>
          <tbody>
      `;

      summaryList.forEach(s => {
        if (currentSummaryTab === 'DAY1') {
          tableHtml += `
            <tr>
              <td><b>${s.rider}</b></td>
              <td>${s.class}</td>
              <td class="summary-score-total">${s.day1}点</td>
            </tr>
          `;
        } else if (currentSummaryTab === 'DAY2') {
          tableHtml += `
            <tr>
              <td><b>${s.rider}</b></td>
              <td>${s.class}</td>
              <td class="summary-score-total">${s.day2}点</td>
            </tr>
          `;
        } else {
          tableHtml += `
            <tr>
              <td><b>${s.rider}</b></td>
              <td>${s.class}</td>
              <td>${s.day1}点</td>
              <td>${s.day2}点</td>
              <td class="summary-score-total">${s.total}点</td>
            </tr>
          `;
        }
      });

      tableHtml += '</tbody></table>';
      container.innerHTML = tableHtml;
    }

    function renderHistory() {
      const historyList = document.getElementById('history-list');
      const history = JSON.parse(localStorage.getItem('trial_scores_v2') || '[]');
      const filtered = history.filter(item => item.day === currentDay);
      
      historyList.innerHTML = filtered.length === 0 
        ? `<li style="color:#a0aec0; font-size:0.75rem;">${currentDay}の記録はまだありません</li>`
        : filtered.map(item => {
            const syncTag = item.synced 
              ? '<span class="sync-badge synced">送信済</span>' 
              : '<span class="sync-badge unsynced">未送信</span>';
            return `
              <li class="history-item">
                <div class="history-detail">
                  <span><b>[${item.class || '未設定'}] ${item.section}</b>: ${item.rider} ${syncTag}</span>
                  <span class="evaluator-tag">${item.day} / 採点者: ${item.evaluator} (${item.time})</span>
                </div>
                <div>
                  <span style="color:#ff6b6b; font-weight:900; margin-right:6px;">減点 ${item.score}</span>
                  <button class="btn-delete" onclick="deleteRecord(${item.id})">🗑️</button>
                </div>
              </li>
            `;
          }).join('');
    }

    initDayUI();
    initClassUI();
    renderRiderUI();
    renderSectionUI();
    initEvaluator();
    renderSummary();
    renderHistory();
  </script>
